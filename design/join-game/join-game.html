<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Race</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="join-game.css">
</head>
<body>
<div class="container">
    <nav class="header">
        <ul class="header-list">
            <li class="header-list-element"><a class="header-list-element-link" href="#home">CalculationRace</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#about">Join Game</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#rankings">Create Game</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#contact">Rankings</a></li>
        </ul>
        <label class="theme-switch">
            <input class="theme-switch-input" type="checkbox"/>
            <span class="theme-slider-container"></span>
        </label>
    </nav>
    <div class="main">
        <h1 class="panel-title">How fast can you calculate?</h1>
        <p class="panel-description">You must calculate the given formula and submit the result to win this game!</p>
        <div class="game-form-container">
            <label class="base-label" for="game-name-input">Join game?</label>
            <input class="base-text-input" type="text" id="game-name-input" placeholder="Game name">
            <button class="button" type="button">Join game</button>
        </div>
    </div>
    <footer class="footer">@Calculation Race 2025</footer>
</div>
</body>
</html>
