<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Race</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="create-game.css">
</head>
<body>
<div class="container">
    <nav class="header">
        <ul class="header-list">
            <li class="header-list-element"><a class="header-list-element-link" href="#home">CalculationRace</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#about">Join Game</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#rankings">Create Game</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#contact">Rankings</a></li>
        </ul>
        <label class="theme-switch">
            <input class="theme-switch-input" type="checkbox"/>
            <span class="theme-slider-container"></span>
        </label>
    </nav>
    <div class="main">
        <h1 class="panel-title">Create a game</h1>
        <div class="room-form-container">
            <div class="game-name-container">
                <label for="room-name" class="base-label">Name your room?</label>
                <input type="text" id="room-name" placeholder="Enter room name" class="base-text-input"/>
            </div>
            <div class="game-type-container">
                <p class="base-label">Type of room? Select game type</p>
                <div>
                    <input class="game-type-input" type="radio" id="red" name="color"/>
                    <label class="room-type-label" for="red">Cooperative</label>
                    <input class="game-type-input" type="radio" id="blue" name="color"/>
                    <label class="room-type-label" for="blue">Competitive</label>
                </div>
            </div>
            <div class="room-button-container">
                <button type="button" class="button">Create room</button>
            </div>
        </div>
    </div>
    <footer class="footer">@Calculation Race 2025</footer>
</div>
</body>
</html>
