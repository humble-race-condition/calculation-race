<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navbar</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container">
    <nav class="header">
        <ul class="header-list">
            <li class="header-list-element"><a class="header-list-element-link" href="#home">CalculationRace</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#rankings">Rankings</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#about">About</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#contact">Contact</a></li>
        </ul>
    </nav>
    <div class="main">
        <h1 class="panel-title">How fast can you calculate?</h1>
        <p class="main-description">You must calculate the given formula and submit the result to win this game!</p>
        <div class="room-input-wrapper">
            <h2 class="input-label">Create room?</h2>
            <label>
                <input type="text" placeholder="Room name" class="base-text-input">
            </label>
            <button type="button" class="create-room-button button">Create room</button>
        </div>
        <div class="room-input-wrapper">
            <h2 class="input-label">Join room?</h2>
            <label>
                <input type="text" placeholder="Room name" class="base-text-input">
            </label>
            <button type="button" class="join-room-button button">Join room</button>
        </div>
    </div>
    <footer class="footer">@Calculation Race 2025</footer>
</div>
</body>
</html>
