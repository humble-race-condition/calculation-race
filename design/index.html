<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Race</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container">
    <nav class="header">
        <ul class="header-list">
            <li class="header-list-element"><a class="header-list-element-link" href="#home">CalculationRace</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#about">Join Room</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#rankings">Create Room</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#contact">Rankings</a></li>
            <label class="theme-switch">
                <input class="theme-switch-input" type="checkbox">
                <span class="theme-slider"></span>
            </label>
        </ul>
    </nav>
    <div class="main">
        <h1 class="panel-title">How fast can you calculate?</h1>
        <p class="main-description">You must calculate the given formula and submit the result to win this game!</p>
        <div class="room-form-container">
            <label class="base-label" for="room-name-input">Join room?</label>
            <input type="text" id="room-name-input" placeholder="Room name" class="base-text-input">
            <button type="button" class="button">Join room</button>
        </div>
    </div>
    <footer class="footer">@Calculation Race 2025</footer>
</div>
</body>
</html>
