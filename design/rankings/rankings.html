<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Race</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="rankings.css">
</head>
<body>
<div class="container">
    <nav class="header">
        <ul class="header-list">
            <li class="header-list-element"><a class="header-list-element-link" href="#home">CalculationRace</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#about">Join Game</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#rankings">Create Game</a></li>
            <li class="header-list-element"><a class="header-list-element-link" href="#contact">Rankings</a></li>
        </ul>
        <label class="theme-switch">
            <input class="theme-switch-input" type="checkbox"/>
            <span class="theme-slider-container"></span>
        </label>
    </nav>
    <div class="main">
        <h1 class="panel-title">Rankings</h1>
        <form class="filter-container">
            <label for="player-filter" class="filter-label">
                <input type="text" id="player-filter" placeholder="Player" class="filter-input"/>
            </label>
            <label for="game-filter" class="filter-label">
                <input type="text" id="game-filter" placeholder="Game" class="filter-input"/>
            </label>
            <div class="button-container">
                <button class="small-button" type="button">Search</button>
            </div>
        </form>
        <div class="rankings-table-container">
            <table class="rankings-table">
                <thead>
                <tr class="rankings-row">
                    <th class="rankings-table-end-column">Position</th>
                    <th class="rankings-table-column">Player</th>
                    <th class="rankings-table-column">Game</th>
                    <th class="rankings-table-column">Player Score</th>
                    <th class="rankings-table-end-column">Room Score</th>
                </tr>
                </thead>
                <tbody>
                <tr class="rankings-row">
                    <td class=rankings-table-end-column>1</td>
                    <td class="rankings-table-column">Gosho</td>
                    <td class="rankings-table-column">Gosho</td>
                    <td class="rankings-table-column">25</td>
                    <td class="rankings-table-end-column">15</td>
                </tr>
                <tr class="rankings-row">
                    <td class="rankings-table-end-column">1</td>
                    <td class="rankings-table-column">Gosho</td>
                    <td class="rankings-table-column">Gosho</td>
                    <td class="rankings-table-column">36</td>
                    <td class="rankings-table-end-column">15</td>
                </tr>
                <tr class="rankings-row">
                    <td class="rankings-table-end-column">1</td>
                    <td class="rankings-table-column">Gosho</td>
                    <td class="rankings-table-column">Gosho</td>
                    <td class="rankings-table-column">31</td>
                    <td class="rankings-table-end-column">15</td>
                </tr>
                </tbody>
            </table>
            <div class="rankings-page-container">
                <button class="small-button" type="button">Previous</button>
                <div class="page-number">5</div>
                <button class="small-button" type="button">Next</button>
            </div>
        </div>
    </div>
    <footer class="footer">@Calculation Race 2025</footer>
</div>
</body>
</html>
